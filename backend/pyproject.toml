[project]
name = "uptimetrace-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jsonschema>=4.21",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "mcp>=1.28,<2",   # official MCP SDK; pinned below 2.x (renamed API), see docs/MCP_INTEGRATION.md
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "pip-audit>=2.7"]
# simulator + baseline models + external-dataset audit. psutil only for resource reporting; joblib is imported directly by
# ml/predict.py and ml/train_baselines.py (was only present transitively via scikit-learn); scipy is imported by simulator_v2/distinct.py;
# pandas is imported by scripts/audit_external_datasets.py (was missing from the environment).
ml = ["numpy>=1.26", "pyarrow>=21", "psutil>=5", "scikit-learn>=1.4", "xgboost>=2", "joblib>=1.3", "scipy>=1.11", "pandas>=2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
