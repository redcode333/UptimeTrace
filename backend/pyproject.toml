[project]
name = "uptimetrace-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jsonschema>=4.21",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "mcp>=1.28,<2",   # official MCP SDK; pinned below 2.x (renamed API), see docs/MCP_INTEGRATION.md
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
ml = ["numpy>=1.26", "pyarrow>=21", "psutil>=5"]   # M3.1 simulator; psutil only for resource reporting

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
