<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="UptimeTrace architecture as implemented">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7ec8ff"/></marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="#0a1020"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e6edf7">
    <rect x="30" y="60" width="180" height="78" rx="10" fill="#111a2c" stroke="#2c3a54"/>
    <text x="120" y="90" text-anchor="middle" font-weight="600">Windows agent</text>
    <text x="120" y="112" text-anchor="middle" font-size="12" fill="#97a2b5">Go · per-mount disk · per-NIC counters</text>

    <rect x="290" y="60" width="200" height="78" rx="10" fill="#111a2c" stroke="#2c3a54"/>
    <text x="390" y="90" text-anchor="middle" font-weight="600">Ingestion API</text>
    <text x="390" y="112" text-anchor="middle" font-size="12" fill="#97a2b5">FastAPI · contract v1 · idempotent</text>

    <rect x="570" y="60" width="180" height="78" rx="10" fill="#111a2c" stroke="#2c3a54"/>
    <text x="660" y="90" text-anchor="middle" font-weight="600">PostgreSQL</text>
    <text x="660" y="112" text-anchor="middle" font-size="12" fill="#97a2b5">telemetry_envelopes (JSONB) · RLS</text>

    <rect x="290" y="250" width="200" height="78" rx="10" fill="#111a2c" stroke="#7ec8ff" stroke-dasharray="6 4"/>
    <text x="390" y="280" text-anchor="middle" font-weight="600">Inference adapter</text>
    <text x="390" y="302" text-anchor="middle" font-size="12" fill="#ffb86b">experimental · local and on request</text>

    <rect x="30" y="250" width="180" height="78" rx="10" fill="#111a2c" stroke="#2c3a54"/>
    <text x="120" y="280" text-anchor="middle" font-weight="600">Browser console</text>
    <text x="120" y="302" text-anchor="middle" font-size="12" fill="#97a2b5">React · Clerk session</text>

    <rect x="570" y="250" width="180" height="78" rx="10" fill="#111a2c" stroke="#2c3a54"/>
    <text x="660" y="280" text-anchor="middle" font-weight="600">MCP clients</text>
    <text x="660" y="302" text-anchor="middle" font-size="12" fill="#97a2b5">read-only tools · bearer token</text>
  </g>
  <g stroke="#7ec8ff" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M212 99 H286"/>
    <path d="M492 99 H566"/>
    <path d="M660 140 V246" stroke-dasharray="none"/>
    <path d="M390 140 V246" stroke-dasharray="6 4"/>
    <path d="M660 246 V140" stroke-dasharray="6 4" marker-end="none"/>
    <path d="M212 289 H286"/>
    <path d="M490 289 H566"/>
  </g>
  <text x="30" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#97a2b5">Solid lines: implemented request paths. Dashed: experimental or read-only access. The inference adapter is not called by the public API.</text>
</svg>